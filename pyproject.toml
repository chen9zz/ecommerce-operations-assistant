[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerceops-copilot"
version = "0.1.0"
description = "Evidence-backed promotion diagnosis with a LightRAG adapter"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "httpx2>=2,<3"]

[project.scripts]
commerceops = "commerceops.cli:main"

[tool.setuptools.packages.find]
include = ["commerceops*"]

[tool.setuptools.package-data]
commerceops = ["static/*", "data/knowledge/*/*.md", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
